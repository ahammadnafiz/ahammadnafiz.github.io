<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ahammad Nafiz's writing has moved</title>
<link rel="canonical" href="https://ahammadnafiz.com/writing/">
<script>
  var m = decodeURIComponent(location.pathname).match(/^\/posts\/([^/]+)\/?$/);
  var to = "/writing/";
  if (m) to += m[1].toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") + "/";
  location.replace("https://ahammadnafiz.com" + to + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://ahammadnafiz.com/writing/">
</head>
<body>
<p>This blog has moved to <a href="https://ahammadnafiz.com/writing/">ahammadnafiz.com/writing</a>.</p>
</body>
</html>
